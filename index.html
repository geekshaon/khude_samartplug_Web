<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Relay Controller – ESP32 Web Portal" />
  <meta name="theme-color" content="#080c14" />
  <title>SmartPlug – Relay Controller</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <svg class="loader-icon" viewBox="0 0 48 48" fill="none">
        <rect x="18" y="2" width="4" height="12" rx="2" fill="currentColor"/>
        <rect x="26" y="2" width="4" height="12" rx="2" fill="currentColor"/>
        <path d="M10 14h28v6a14 14 0 01-28 0v-6z" fill="currentColor" opacity=".9"/>
        <rect x="21" y="30" width="6" height="14" rx="3" fill="currentColor"/>
        <rect x="16" y="42" width="16" height="4" rx="2" fill="currentColor" opacity=".4"/>
      </svg>
      <p class="loader-text">Connecting to Device…</p>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="app" class="app" hidden>
    <header class="navbar" role="banner">
      <div class="navbar-inner">

        <!-- 1. Brand — always pinned left -->
        <div class="navbar-brand">
          <svg class="brand-logo" viewBox="0 0 32 32" fill="none">
            <rect x="12" y="1" width="3" height="9" rx="1.5" fill="currentColor"/>
            <rect x="17" y="1" width="3" height="9" rx="1.5" fill="currentColor"/>
            <path d="M6 10h20v4a10 10 0 01-20 0v-4z" fill="currentColor"/>
            <rect x="14" y="22" width="4" height="8" rx="2" fill="currentColor" opacity=".7"/>
            <rect x="10" y="29" width="12" height="3" rx="1.5" fill="currentColor" opacity=".4"/>
          </svg>
          <div class="brand-text">
            <span class="brand-name">SmartPlug</span>
            <span class="brand-badge">ESP32</span>
          </div>
        </div>

        <!-- 2. Nav links — centered, wraps to second row on mobile -->
        <nav class="navbar-nav" role="navigation" aria-label="Main navigation">
          <a href="#dashboard" class="nav-link active" id="nav-dashboard">
            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="#settings" class="nav-link" id="nav-settings">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            <span>Settings</span>
          </a>
        </nav>

        <!-- 3. Status cluster — always pinned right -->
        <div class="navbar-end">
          <div class="nav-clock" id="nav-clock" title="Current time">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
            <span id="clock-hhmm">--:--</span><span class="nav-clock-seconds" id="clock-ss">:--</span>
          </div>
          <div class="temp-chip" id="temp-chip" hidden>
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 00-1 1v6.586l-1-1a1 1 0 10-1.414 1.414l2.707 2.707a1 1 0 001.414 0l2.707-2.707A1 1 0 0012 8.586L11 9.586V3a1 1 0 00-1-1zM6 15a4 4 0 118 0 4 4 0 01-8 0z"/></svg>
            <span id="temp-value">--.-</span><span>°C</span>
          </div>
          <div class="conn-indicator" id="conn-indicator" title="Connection status">
            <span class="conn-dot"></span>
          </div>
        </div>

      </div>
    </header>

    <main id="view-root" class="main-content" role="main"></main>
  </div>

  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-container" id="modal-container">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <div>
          <span class="modal-relay-label" id="modal-relay-label">Relay 1</span>
          <h2 id="modal-title" class="modal-title-text">Configure Rule</h2>
        </div>
        <button class="modal-close-btn" id="modal-close" aria-label="Close">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="rule-tabs" id="rule-tabs" role="tablist" aria-label="Rule types"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          Save Rule
        </button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
